name: build
on:
  push:
  pull_request:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:lts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: npm i
        run: npm i
      - name: Build
        run: npm run build
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: dist
  integrate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Fetch pre-built pages
        uses: actions/download-artifact@v8
        with:
          name: frontend
      - name: Fetch pre-built dataset
        uses: robinraju/release-downloader@v1
        with:
          repository: openeuler-riscv/bsp-db
          latest: true
          fileName: dataset.tar.zst
      - name: Decompress dataset
        run: tar -xf dataset.tar.zst && rm dataset.tar.zst
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: frontend-full
          path: .
  oci_publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: integrate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch pre-built site
        uses: actions/download-artifact@v8
        with:
          name: frontend-full
          path: dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
